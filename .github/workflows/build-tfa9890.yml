name: Build kernel with TFA9890 right-channel firmware fix

on:
  push:
    branches: [ tfa9890-rightfix-rombase ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc zip cpio

      - name: Install toolchain (AOSP arm 4.9, aliased to the prefix build.sh expects)
        run: |
          mkdir -p $HOME/tc
          curl -sL "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/android-7.1.2_r1.tar.gz" | tar -xz -C $HOME/tc
          cd $HOME/tc/bin
          for f in arm-linux-androideabi-*; do ln -sf "$f" "arm-linux-gnueabihf-${f#arm-linux-androideabi-}"; done
          $HOME/tc/bin/arm-linux-gnueabihf-gcc --version | head -1

      - name: Build kernel
        run: |
          export PATH="$HOME/tc/bin:$PATH"
          export ARCH=arm
          export CI=true
          export KERNEL_ZIP="SmokeR24.1-TFA9890-rightfix.zip"
          bash build.sh

      - name: Verify TFA9890 firmware data in vmlinux
        run: |
          python3 - <<'PYEOF'
          import sys
          expected = {
            'tfa9890_right.speaker':      bytes.fromhex(""),
            'tfa9890_right_music.preset': bytes.fromhex("0000010000c80000020000000000c800000000012c0147ae002bb000147b0147ae010000fb0000000000080000100000028000010000000ccd00400000000000014801000000014800014808000007c28f0007ae000014"),
            'tfa9890_left.speaker':       bytes.fromhex(""),
            'tfa9890_left_music.preset':  bytes.fromhex("0000010000c80000020000000000c800000000012c0147ae002bb000147b00a3d7010000fb0000000000080000080000028000010000000ccd00400000000000014801000000014800014808000007c28f0007ae000014"),
          }
          vm = open('vmlinux', 'rb').read()
          ok = True
          for name, data in expected.items():
              present = data in vm
              print('  %-8s %s' % ('OK' if present else 'MISSING', name))
              ok = ok and present
          names = [b'tfa9890_right.speaker', b'tfa9890_right_music.preset',
                   b'tfa9890_left.speaker', b'tfa9890_left_music.preset']
          for name in names:
              cnt = vm.count(name + bytes([0]))
              print('  builtin_fw name %s: count=%d' % (name.decode(), cnt))
              ok = ok and cnt >= 1
          print('VERIFY:', 'PASS' if ok else 'FAIL')
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Diagnostic diff of built DTB vs ROM DTB
        run: |
          python3 - <<'DTBEOF'
          import base64, struct, sys
          ROM = base64.b64decode('')
          NUL = bytes([0])
          def parse(d):
              STR = struct.unpack_from('>I', d, 12)[0]
              S = struct.unpack_from('>I', d, 8)[0]
              def nm(o):
                  e = d.find(NUL, STR + o); return d[STR + o:e].decode('latin1')
              out = {}
              def walk(p, path):
                  while True:
                      tok, = struct.unpack_from('>I', d, p)
                      if tok == 1:
                          e = d.find(NUL, p + 4)
                          n = d[p + 4:e].decode('latin1')
                          p = walk((e + 4) & ~3, path + '/' + n)
                      elif tok == 2: return p + 4
                      elif tok == 3:
                          ln, no = struct.unpack_from('>II', d, p + 4)
                          out.setdefault(path, {})[nm(no)] = bytes(d[p + 12:p + 12 + ln])
                          p = (p + 12 + ln + 3) & ~3
                      elif tok == 4: p += 4
                      elif tok == 9: return p + 4
                      else: return p
              walk(S, '')
              return out
          SKIP = ['nvidia,dtbbuildtime', 'nvidia,dtsfilename']
          a = parse(bytearray(ROM)); b = parse(bytearray(open('anykernel/kernel/dtb', 'rb').read()))
          print('ROM nodes=' + str(len(a)) + '  built nodes=' + str(len(b)))
          for k in sorted(set(a) - set(b)): print('  ONLY-IN-ROM : ' + k)
          for k in sorted(set(b) - set(a)): print('  ONLY-IN-BUILT: ' + k)
          n = 0
          for k in sorted(set(a) & set(b)):
              for p in sorted(set(a[k]) | set(b[k])):
                  if p in SKIP: continue
                  va, vb = a[k].get(p), b[k].get(p)
                  if va != vb:
                      n += 1
                      if n <= 40:
                          print('  DIFF ' + k + ' / ' + p)
                          print('     ROM : ' + (va or b'').hex()[:72])
                          print('     BLD : ' + (vb or b'').hex()[:72])
          print('TOTAL property diffs: ' + str(n))
          DTBEOF

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: SmokeR24.1-TFA9890-rightfix
          path: output/*.zip
          if-no-files-found: error
